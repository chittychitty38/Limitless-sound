    midi editor: ["editor midi", "editor de midi", "mostrar [el] editor midi"]
    workspace: ["espacio de trabajo", "mostrar [el] espacio de trabajo"]
    new track: *new_track
    solo: *solo
    mute: *mute
    arm: *arm
    next track: *next_track
    previous track: *previous_track
    shuffle mode: ["modo shuffle", "shuffle"]
    slip mode: ["modo slip", "slip", "modo libre"]
    spot mode: ["modo spot", "spot"]
