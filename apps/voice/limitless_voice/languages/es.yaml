    grabber: ["herramienta mano", "herramienta de mano", "agarrador"]
    scrubber: ["herramienta scrub", "herramienta de arrastre", "scrubber"]
    pencil: ["lápiz", "herramienta lápiz", "herramienta de lápiz"]
    redo: *redo
    separate: ["separar", "separa", "separar clip", "dividir", "divide", "dividir aquí", "cortar aquí",
