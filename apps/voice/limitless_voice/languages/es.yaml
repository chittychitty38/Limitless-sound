    heal: ["reparar", "repara", "reparar [la] separación", "repara [la] separación"]
    duplicate: ["duplicar", "duplica", "duplicar eso", "duplica eso", "duplícalo"]
    repeat: ["repetir", "repetir clip", "repite [el] clip"]
    trim to selection: ["recortar a [la] selección", "recortar", "recorta"]
    fades: ["fundidos", "fundido", "crear fundidos", "hacer fundidos", "fades", "fade"]
    consolidate: ["consolidar", "consolida", "consolidar clip"]
    quantize: *quantize
    delete: *delete
    tab to transient: ["siguiente transitorio", "ir al siguiente transitorio", "transitorio siguiente"]
    zoom in: *zoom_in
    zoom out: *zoom_out
    zoom to fit: *fit
    bounce: ["bounce", "exportar [la] mezcla", "exportar mezcla", "bounce a disco", "hacer [el] bounce"]
    save as: ["guardar como", "guarda como"]
