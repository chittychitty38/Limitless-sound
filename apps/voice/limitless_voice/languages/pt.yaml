  # Where to add a voice: the names are the ones in Brazilian Portuguese on the Mac and in Windows.
  "There's no {language} voice on this Mac, so replies are read in its own voice. To add one: System Settings › Accessibility › Spoken Content › System voice › Manage Voices.": "Este Mac não tem uma voz em português, então as respostas são lidas com a voz padrão. Para adicionar uma: Ajustes do Sistema › Acessibilidade › Conteúdo Falado › Voz do Sistema › Gerenciar Vozes."
  "There's no {language} voice on this computer, so replies are read in its own voice. To add one: Settings › Time & language › Speech › Add voices.": "Este computador não tem uma voz em português, então as respostas são lidas com a voz padrão. Para adicionar uma: Configurações › Hora e idioma › Fala › Adicionar vozes."
  "There's no {language} voice on this computer, so replies are read in its own voice.": "Este computador não tem uma voz em português, então as respostas são lidas com a voz padrão."
  # what can I say
  What you can say: O que você pode dizer
