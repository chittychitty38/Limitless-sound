# Brazilian Portuguese. Where musicians say it two ways ("faixa" and "trilha" for a track, "recortar"
# and "cortar" for Cut), both are here, and the English names many keep using (solo, mute, loop,
# stop, mixer, take, clique), spelled as words the speech model knows where it doesn't know them
# (sounds_like below). It doesn't know "play", "shift" or "tab" in any spelling, so those are
# "tocar", "maiúsculas" and "tabulação" here.
# Every word must be one the model knows: stress/test_voice_language.py checks, and for a word it
# doesn't know prints the nearest it does. A command said alone is the infinitive, as the menus name
# it ("tocar", "voltar", "recortar", "apagar"), never "toca", "volta", "corta" or "apaga": the small
# speech model hears real people's short imperatives far less often (toca 32%, volta 41%, aproxima
# 29%, against tocar 63%, voltar 63%, juntar 90%; stress/test_command_words.py), and for Cut, Paste,
# Delete and Duplicate a word that sounds like one must never throw work away (in Spanish, real
# people's "corte" came back as "corta" and pressed Cut). Imperatives are fine before more words
# ("silencia a faixa", "divide aqui").
# See language.py for what each section is, and en.yaml for the English it follows.

code: pt
name: Português
english_name: Portuguese
# A preview, and Settings says so. The only small Portuguese speech model under a permissive licence
# hears real people's command words about 6 times in 10, where Spanish's hears 8 in 10: on the same
# kind of recordings it hears nothing at all in a third of them (Spanish's: 4%), and on read
# sentences it gets 27% of words wrong (Spanish's: 15%). See stress/README.md.
preview:
  label: Português (prévia)
  # Said in Portuguese whatever language the windows are in, as the download note is. English stays
  # one choice away, for musicians who already know the DAW terms in English.
  note: 'Prévia: em português, o Limitless Voice entende cerca de 6 em cada 10 comandos ditos por pessoas reais, menos que em inglês e espanhol. Os comandos funcionam melhor ditos inteiros e devagar, como "tocar", "voltar" e "salvar". Se você já conhece os termos em inglês, os comandos em inglês, que o Voice entende com mais frequência, continuam disponíveis: é só escolher English aqui.'

# vosk-model-small-pt-0.3, Apache 2.0 (Alpha Cephei, alphacephei.com/vosk/models).
# Downloaded once when Portuguese is chosen; the installers ship only English.
models:
  vosk-model-small-pt-0.3: {label: "Portuguese, fast", size: "31 MB"}

# Replies are read by a Portuguese system voice (voice_out.py): on a Mac the first of these that's
# installed (Brazil's first), else any voice for "pt"; on Windows any whose name or language says
# Portuguese.
voice:
  mac: [Luciana, Felipe, Fernanda, Joana, Catarina]
  match: [portuguese, português]

words:
  wake: [acorda, acordar, começar a ouvir, comece a ouvir, começa a ouvir, computador acorda]
  sleep: [vai dormir, dormir, pode dormir, parar de ouvir, pare de ouvir, para de ouvir]
  cancel: [cancelar, cancela, não, esquece, deixa pra lá, deixa para lá]
  "yes": [sim, confirmar, confirma, pode, pode fazer, faça isso, sim por favor]
  again: [de novo, outra vez, mais uma vez, repete isso, repita isso, faz de novo, faça de novo]
  help: [o que eu posso dizer, o que posso dizer, mostrar comandos, mostrar os comandos, mostra os comandos,
         ajuda]
  dictation_on: [começar ditado, começar o ditado, iniciar ditado, iniciar o ditado, modo ditado, ativar ditado,
                 ativar o ditado, ditado ligado]
  dictation_off: [parar ditado, parar o ditado, terminar ditado, terminar o ditado, encerrar ditado,
                  encerrar o ditado, modo comandos, modo comando, desativar ditado, desativar o ditado,
                  ditado desligado]
  take_stop: [parar, pare, para, stop, parar gravação, parar a gravação, pare a gravação, parar reprodução,
              parar a reprodução, pare a reprodução, parar o take]
  take_off: [sair do modo take, modo take desligado, todos os comandos]
  scratch: [apaga isso, apagar isso, risca isso]
  new_line: [nova linha, quebra de linha, próxima linha]
  new_paragraph: [novo parágrafo]
  times: [vezes, vez]
  twice: []
  filler_start: [por favor, hum, é, então, bom, ei, ei computador, oi computador, computador, ok, okay, tá]
  filler_end: [por favor, obrigado, obrigada, valeu]
  recognize: [apaga isso, apagar isso, risca isso, nova linha, quebra de linha, próxima linha, novo parágrafo,
              vezes, vez, por favor, e,
              # Said alone, these do nothing: they're here so the command recognizer can write them
              # down instead of the command they sound like. Other forms of the command words
              # ("gravado" isn't "gravar"), words a letter from a destructive one ("pagar" and
              # "apagar"), and words said alone all the time ("isso", "nada").
              gravado, gravada, gravação, gravou, grave, gravando, tocando, tocou, toque, reprodução, parado,
              parada, parou, salvo, salvou, dividido, divisão, união, unido, cortado, corte, corta, cortou,
              recorte, recorta, colado, cola, colou, apagado, apaga, apagou, pagar, paga, pagou, excluído, cópia,
              copiado, duplicado, silêncio, sola, voltou, acorde, isso, nada, este, aqui]

punctuation:
  vírgula: ","
  ponto: "."
  ponto final: "."
  ponto de interrogação: "?"
  ponto de exclamação: "!"
  dois pontos: ":"
  ponto e vírgula: ";"
  travessão: " -"
  abre aspas: ' "'
  fecha aspas: '"'

numbers:
  units: {zero: 0, um: 1, uma: 1, dois: 2, duas: 2, três: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8,
          nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, catorze: 14, quatorze: 14, quinze: 15,
          dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19}
  tens: {vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90}
  hundreds: {cem: 100, cento: 100, duzentos: 200, duzentas: 200, trezentos: 300, trezentas: 300,
             quatrocentos: 400, quinhentos: 500, seiscentos: 600, setecentos: 700, oitocentos: 800,
             novecentos: 900}
  scales: {mil: 1000}
  # "cento e vinte e oito", "mil e quinhentos", "trinta e dois"
  joiners: {e: [tens, hundreds, scales]}
  # "um" and "uma" are also the article: "adicionar uma faixa" isn't "adicionar 1 faixa".
  articles: [um, uma]
  # "meia" is six when Brazilians read out digits ("compasso um meia")
  homophones: {meia: seis}
  expects_number: [compasso, faixa, trilha, marcador, tempo, canal, número, memória]

keys:
  names:
    comando: cmd
    control: ctrl
    controle: ctrl
    opção: opt
    maiúsculas: shift
    enter: return
    retorno: return
    tabulação: tab
    espaço: space
    barra de espaço: space
    apagar: delete
    escape: escape
    home: home
    início: home
    fim: end
    esquerda: left
    direita: right
    cima: up
    para cima: up
    baixo: down
    para baixo: down
    ponto: "."
    vírgula: ","
    barra: /
    menos: "-"
    hífen: "-"
    traço: "-"
    igual: "="
    mais: "="
    ponto e vírgula: ;
    apóstrofo: "'"
    barra invertida: \
    colchete: "["
    abre colchete: "["
    fecha colchete: "]"
  # The letters' Brazilian names, as the speech model writes them ("efe", "gê" and "ene" it writes
  # as the letter itself; it has no "dáblio"), and the radio alphabet as Brazilians say it.
  letters: {a: a, bê: b, cê: c, dê: d, e: e, é: e, f: f, g: g, agá: h, i: i, jota: j, cá: k, ele: l,
            eme: m, "n": "n", o: o, ó: o, pê: p, quê: q, erre: r, esse: s, tê: t, u: u, vê: v,
            xis: x, ípsilon: "y", zê: z,
            alfa: a, bravo: b, charlie: c, delta: d, eco: e, golfe: g, hotel: h, índia: i,
            julieta: j, quilo: k, lima: l, novembro: n, oscar: o, papa: p, quebec: q, romeu: r,
            sierra: s, tango: t, uniforme: u, vítor: v, uísque: w, zulu: z}
  f: [f]

# The command recognizer can write a whole sentence in command words, as Spanish's did, since
# Portuguese's include "de", "o", "a" and "para": "abrir ..." and "escrever ..." take their words
# from the open recognizer only.
free_text_needs_both: true
# A near miss never cuts, pastes or deletes: "pagar" is one letter from "apagar".
exact_destructive: true
# And no command runs on a near miss at all: real people's "sala" (room) was Save, "parte" (part)
# Play, "muita" Mute and "copa" Copy, each a letter from a command (stress/test_command_words.py),
# and a reader's "para" (for) pressed Play (test_voice_real_speech.py).
exact: true
# When the open recognizer heard two words or more without the command recognizer's first, or
# two more words than it, it was talk: in an hour of people reading aloud, the command recognizer
# heard "parar" in "quando você liga para alguém que", "dividir" in "o que alguns casos de vírus
# ebola ocorreram", "solo" in "polo químicas" and "para" in "se para se" (test_voice_real_speech.py).
sentence_words: 2

# Words the speech model doesn't know, spelled as words it does. The recognizer listens for
# these spellings; normalize() turns them back.
sounds_like:
  mute: [mi ute]
  loop: [lupi]
  loops: [lupas]
  mixer: [mix ser]
  take: [tei que]
  roll: [rol]
  spot: [sport]
  # nearest to "quanti-zar" of the words it knows
  quantizar: [quantia azar]

