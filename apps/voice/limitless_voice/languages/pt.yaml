  Still listening from the menu bar: Continuo ouvindo pela barra de menus
  Go to sleep: Parar de ouvir
  Wake up: Começar a ouvir
  Still listening. Open it again from the menu bar icon.: Continuo ouvindo. Abra de novo pelo ícone na barra de menus.
  # choosing the language, and downloading it
  Listening in {language}: Ouvindo em português
  "{language} is downloaded once ({size}), then works without internet.": "O português é baixado uma vez ({size}) e depois funciona sem internet."
  "To listen in {language}, Limitless Voice needs to download its speech model ({size}). Until then, it keeps listening as before.": "Para ouvir em português, o Limitless Voice precisa baixar o modelo de voz ({size}). Até lá, continua ouvindo como antes."
