  Welcome to Limitless Voice. Setup takes about a minute. Press Continue.: Boas-vindas ao Limitless Voice. A configuração leva mais ou menos um minuto. Clique em Continuar.
  "Run Logic Pro, Pro Tools and your whole computer with your voice.<br><br>Say <b>“{bar}”</b>, <b>“{solo}”</b> or <b>“{mixer}”</b>, and it happens in the app you're working in.<br><br>Everything runs on this computer. Your voice is never recorded or sent anywhere, and it works without internet.<br><br>Setup takes about a minute.": "Comande o Logic Pro, o Pro Tools e todo o seu computador com a voz.<br><br>Diga <b>“{bar}”</b>, <b>“{solo}”</b> ou <b>“{mixer}”</b> e acontece no aplicativo em que você está trabalhando.<br><br>Tudo funciona neste computador. Sua voz nunca é gravada nem enviada a lugar nenhum, e funciona sem internet.<br><br>A configuração leva mais ou menos um minuto."
