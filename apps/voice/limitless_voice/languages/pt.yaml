  "{command} works when Logic Pro or Pro Tools is in front.": "{command} funciona quando o Logic Pro ou o Pro Tools está na frente."
  "Limitless Voice has no action {action}.": "O Limitless Voice não tem a ação {action}."
  Asleep: Em pausa
  "Take mode: say stop to end the take": "Modo take: diga parar para terminar o take"
  That command needs a spoken yes, so it can't be run from another app.: Esse comando precisa que você diga sim, então não pode ser usado por outro aplicativo.
  # the window and the floating display
  'Listening: say "{sleep}" to pause': 'Ouvindo: diga "{sleep}" para pausar'
  'Asleep: say "{wake}" or press here to start': 'Em pausa: diga "{wake}" ou clique aqui para começar'
  'Dictating: say "{stop}" to go back to commands': 'Ditando: diga "{stop}" para voltar aos comandos'
  'Take mode: only "{stop}" works until the take ends': 'Modo take: só "{stop}" funciona até o take terminar'
  Take mode: Modo take
  Dictating: Ditando
