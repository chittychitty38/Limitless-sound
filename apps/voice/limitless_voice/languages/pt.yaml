  Opens Export Audio/Video: Abre Exportar áudio/vídeo

# For each built-in pack, for each command by its first English phrase: what to say in Portuguese.
# A list is every way to say the command; a mapping gives them per English phrase, where the
# suite needs to know which was meant (play or stop). Shared lists are written once (&name) and
# reused (*name).
commands:
  Everywhere:
    press {chord:keys}: ["aperte {chord:keys}", "aperta {chord:keys}", "apertar {chord:keys}",
                         "pressione {chord:keys}", "pressionar {chord:keys}", "tecla {chord:keys}"]
    type {words:text}: ["escreva {words:text}", "escreve {words:text}", "escrever {words:text}",
                        "digite {words:text}", "digita {words:text}", "digitar {words:text}"]
    undo: ["desfazer", "desfaz", "desfazer isso", "desfaz isso"]
    redo: &redo ["refazer", "refaz", "refazer isso", "refaz isso"]
    copy: ["copiar", "copia", "copiar isso", "copia isso"]
    cut: ["recortar", "cortar", "recortar isso", "recorta isso", "cortar isso", "corta isso"]
    paste: ["colar", "colar isso", "cola isso"]
    select all: ["selecionar tudo", "seleciona tudo", "selecione tudo"]
    save: ["salvar", "salva", "salvar [o] projeto", "salva [o] projeto", "salvar [a] sessão", "salva [a] sessão",
           "salvar isso", "salva isso"]
    press enter: ["aperte enter", "aperta enter", "apertar enter", "enter"]
    escape: ["escape", "aperte escape", "aperta escape", "tecla escape"]
    tab: ["tab", "próximo campo", "campo seguinte"]
    previous field: ["campo anterior"]
    # Not "cima" or "direita" alone, as English isn't "up" or "right" alone: they're said all the time.
    move up: ["mover para cima", "move para cima", "seta para cima", "seta pra cima"]
    move down: ["mover para baixo", "move para baixo", "seta para baixo", "seta pra baixo"]
    move left: ["mover para a esquerda", "move para a esquerda", "seta para a esquerda", "seta esquerda"]
    move right: ["mover para a direita", "move para a direita", "seta para a direita", "seta direita"]
    page up: ["página para cima", "subir página", "página anterior"]
    page down: ["página para baixo", "descer página", "próxima página"]
    # Not "ir para ...": "ir para o compasso trinta e dois" would open an app by that name.
    open {name:text}: ["abrir {name:text}", "abre {name:text}", "abra {name:text}", "mudar para {name:text}",
                       "muda para {name:text}", "trocar para {name:text}"]
    next window: ["próxima janela", "janela seguinte", "trocar de janela", "mudar de janela"]
    close [the] window: ["fechar [a] janela", "fecha [a] janela", "feche [a] janela"]
    quit [the] app: ["sair do aplicativo", "fechar [o] aplicativo", "fecha [o] aplicativo", "sair do app",
                     "fechar [o] app", "encerrar [o] aplicativo"]
    mission control: ["mission control", "mostrar todas as janelas", "todas as janelas", "visão de tarefas"]
    show desktop: ["mostrar [a] área de trabalho", "ver [a] área de trabalho"]
    spotlight: ["spotlight", "buscar no computador", "pesquisar no computador", "menu iniciar"]
    volume up: ["aumentar [o] volume", "aumenta [o] volume", "mais volume", "mais alto"]
    volume down: ["diminuir [o] volume", "diminui [o] volume", "abaixar [o] volume", "abaixa [o] volume",
                  "menos volume", "mais baixo"]
    mute volume: ["silenciar [o] som", "tirar [o] som", "ativar [o] som", "silenciar [o] áudio", "mutar [o] som"]
    set volume to {level:number}: ["volume em {level:number}", "volume no {level:number}",
                                   "volume para {level:number}", "colocar [o] volume em {level:number}",
                                   "coloca [o] volume em {level:number}"]
    zoom screen in: ["ampliar [a] tela", "aproximar [a] tela"]
    zoom screen out: ["reduzir [a] tela", "afastar [a] tela"]

  Logic Pro:
    play: &play
      play: ["tocar", "toca", "play", "dar play", "dá play", "reproduzir"]
      # Not "para" alone: it's also "for", said all the time.
      stop: ["parar", "pare", "stop"]
      start playback: ["iniciar [a] reprodução", "começar [a] reprodução"]
      stop playback: ["parar [a] reprodução", "pare [a] reprodução", "parar de tocar", "para de tocar"]
    record: &record ["gravar", "grava", "começar a gravar", "comece a gravar", "começa a gravar",
                     "iniciar [a] gravação"]
    capture [the] recording: ["capturar [a] gravação", "captura [a] gravação", "capturar isso", "captura isso"]
    cycle: ["ciclo", "loop", "ativar [o] ciclo", "ativar [o] loop", "modo ciclo"]
    metronome: &metronome ["metrônomo", "click", "clique", "ativar [o] metrônomo", "ativar [o] click",
                           "ativar [o] clique"]
    go to start: &start ["ir para o início", "ir pro início", "voltar para o início", "voltar pro início",
                         "voltar ao início", "ir para o começo", "voltar para o começo", "voltar pro começo",
                         "voltar ao começo", "ao início", "pro início"]
    forward: ["avançar", "avança", "para frente", "pra frente", "próximo compasso", "compasso seguinte",
              "avançar [um] compasso"]
    back: ["voltar", "volta", "retroceder", "para trás", "pra trás", "compasso anterior", "voltar [um] compasso"]
    go to bar {bar:number}: &bar ["ir para o compasso {bar:number}", "ir pro compasso {bar:number}",
                                  "ir ao compasso {bar:number}", "compasso {bar:number}",
                                  "pular para o compasso {bar:number}", "vai para o compasso {bar:number}",
                                  "vá para o compasso {bar:number}"]
    new track: &new_track ["nova faixa", "faixa nova", "novas faixas", "nova trilha", "trilha nova",
                           "adicionar [uma] faixa", "adicionar [uma] trilha", "criar [uma] faixa"]
    new audio track: ["nova faixa de áudio", "nova trilha de áudio", "adicionar [uma] faixa de áudio",
                      "adicionar [uma] trilha de áudio"]
    new instrument track: ["nova faixa de instrumento", "nova trilha de instrumento", "novo instrumento de software",
                           "adicionar [uma] faixa de instrumento", "adicionar [uma] trilha de instrumento"]
    duplicate track: ["duplicar [a] faixa", "duplica [a] faixa", "duplicar [a] trilha", "duplica [a] trilha",
                      "nova faixa com os mesmos ajustes"]
    next track: &next_track ["próxima faixa", "faixa seguinte", "faixa de baixo", "próxima trilha", "trilha seguinte"]
    previous track: &previous_track ["faixa anterior", "faixa de cima", "trilha anterior"]
    solo: &solo ["solo", "solo na faixa", "solar [a] faixa", "colocar em solo", "coloca em solo", "dar solo",
                 "tirar [o] solo", "tira [o] solo"]
    mute: &mute ["mute", "mutar", "muta", "silenciar", "silencia", "silenciar [a] faixa", "silencia [a] faixa",
                 "mutar [a] faixa", "muta [a] faixa", "dar mute", "tirar [o] mute", "tira [o] mute", "desmutar"]
