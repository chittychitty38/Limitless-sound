  Let your voice press the keys: Deixe sua voz apertar as teclas
  "To play, record and edit for you, Limitless Voice presses keys in Logic and Pro Tools, the same way you would.<br><br>macOS needs your OK for that:<br>1. Press <b>Open Accessibility settings</b>.<br>2. Turn on the switch next to <b>Limitless Voice</b> (you may need your password).<br>3. Come back here. This page notices by itself.": "Para tocar, gravar e editar por você, o Limitless Voice aperta teclas no Logic e no Pro Tools, do mesmo jeito que você faria.<br><br>O macOS precisa da sua permissão para isso:<br>1. Clique em <b>Abrir os ajustes de Acessibilidade</b>.<br>2. Ative o botão ao lado de <b>Limitless Voice</b> (talvez seja preciso digitar sua senha).<br>3. Volte aqui. Esta página percebe sozinha."
