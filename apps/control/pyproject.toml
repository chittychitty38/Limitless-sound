[project]
name = "limitless-control"
version = "0.2.2"
description = "Use the Xbox Adaptive Controller, switches or any gamepad as key commands for Logic Pro, Pro Tools, Ableton Live and the rest of your computer."
requires-python = ">=3.10"
dependencies = [
  "pygame-ce==2.5.8",
  "pynput==1.8.2",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyttsx3==2.99; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller==6.22.3"]

[project.scripts]
limitless-control = "limitless_control.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["limitless_control"]

[tool.setuptools.package-data]
limitless_control = ["web/*"]
