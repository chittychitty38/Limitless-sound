name: Limitless Control

on:
  push:
    branches: [main]
    tags: ["control-v*"]
    paths: ["apps/control/**", ".github/workflows/control.yml"]
  pull_request:
    paths: ["apps/control/**", ".github/workflows/control.yml"]
  workflow_dispatch:

# A newer push to the same pull request replaces the run still going for the older one.
concurrency:
  group: control-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/control

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    # Signing happens only when these secrets exist (SIGNING.md); without them the build is unsigned.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pyinstaller --noconfirm packaging/limitless_control.spec

      - name: Sign and notarize (macOS, only if the Apple secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/mac-sign.sh" keychain
          "$GITHUB_WORKSPACE/.github/scripts/mac-sign.sh" app "dist/Limitless Control.app"
          "$GITHUB_WORKSPACE/.github/scripts/mac-sign.sh" notarize "dist/Limitless Control.app"
      - name: Sign the program (Windows, only if the Windows secrets are set)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\win-sign.ps1" "dist\Limitless Control\Limitless Control.exe"'

      - name: Smoke test the built app
        shell: bash
        env:
          SDL_VIDEODRIVER: ${{ runner.os == 'Linux' && 'dummy' || '' }}
          SDL_AUDIODRIVER: dummy
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="dist/Limitless Control.app/Contents/MacOS/Limitless Control"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            APP="dist/Limitless Control/Limitless Control.exe"
          else
            APP="dist/Limitless Control/Limitless Control"
          fi
          set +e
          "$APP" --self-test > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ $code -ne 0 ]; then
            # Surface the error as annotations so it shows on the PR without opening logs.
            tail -n 30 smoke.log | while IFS= read -r line; do echo "::error title=Smoke test::$line"; done
          fi
          exit $code

      - name: Make the Mac disk image
        if: runner.os == 'macOS'
        run: |
          OUT="dist/LimitlessControl-${{ matrix.name }}.dmg"
          pip install dmgbuild==1.6.7
          # Styled window: app icon, arrow, Applications folder. Plain image if that fails.
          if dmgbuild -s packaging/dmg_settings.py -D app="dist/Limitless Control.app" "Limitless Control" "$OUT"; then
            echo "::notice title=Disk image::Styled disk image built with dmgbuild"
          else
            echo "::warning title=Disk image::dmgbuild failed; built a plain disk image instead"
            mkdir -p dmg
            cp -R "dist/Limitless Control.app" dmg/
            ln -s /Applications dmg/Applications
            "$GITHUB_WORKSPACE/.github/scripts/hdiutil-retry.sh" create -volname "Limitless Control" -srcfolder dmg -ov -format UDZO "$OUT"
          fi
          hdiutil verify "$OUT"

      - name: Make the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = python -c "import limitless_control; print(limitless_control.__version__)"
          iscc /DMyVersion=$version packaging\windows\installer.iss
      - name: Sign the installer (Windows, only if the Windows secrets are set)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\win-sign.ps1" "dist\*Setup.exe"'

      - name: Make the Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/LimitlessControl-linux.tar.gz" "Limitless Control"

      - uses: actions/upload-artifact@v4
        with:
          name: LimitlessControl-${{ matrix.name }}
          path: |
            apps/control/dist/*.dmg
            apps/control/dist/*Setup.exe
            apps/control/dist/*.tar.gz
          if-no-files-found: error


  # Publishes a release page with every installer. A new version in
  # limitless_control/__init__.py merged to main releases itself (tag control-v<version>);
  # pushing a control-v* tag by hand works too.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/control-v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' limitless_control/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "control-v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release control-v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          pattern: LimitlessControl-*
          path: apps/control/release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: control-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Limitless Control ${{ steps.v.outputs.version }}
          body_path: apps/control/RELEASE.md
          # The repo's Latest release is the whole Limitless Sound suite download.
          make_latest: "false"
          files: apps/control/release/*
