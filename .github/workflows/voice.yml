# Limitless Voice: builds the installers on real Macs and Windows machines.
# Runs when apps/voice changes. A tag like voice-v0.2.0 also
# publishes a release with the installers attached.
name: Limitless Voice

on:
  push:
    branches: [main]
    tags: ["voice-v*"]
    paths: ["apps/voice/**", ".github/workflows/voice.yml"]
  pull_request:
    paths: ["apps/voice/**", ".github/workflows/voice.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/voice

# A newer push to the same pull request replaces the run still going for the older one.
concurrency:
  group: voice-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MODEL: vosk-model-small-en-us-0.15

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (M1 and later)
            label: mac-apple-silicon
          - os: macos-15-intel    # Intel Macs
            label: mac-intel
          - os: windows-latest    # Windows 10 and 11, 64-bit
            label: windows
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Download speech model
        shell: bash
        run: |
          mkdir -p models
          curl -sSfL -o model.zip "https://alphacephei.com/vosk/models/${MODEL}.zip"
          python -m zipfile -e model.zip models/
          test -d "models/${MODEL}/am"

      - name: Build app
        run: pyinstaller --noconfirm limitless_voice.spec

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import limitless_voice; print(limitless_voice.__version__)')" >> "$GITHUB_OUTPUT"

      # ---- Mac: optional signing + notarization, then a .dmg ------------
      - name: Sign and notarize (only if the Apple secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp \
            --entitlements installer/mac-entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/Limitless Voice.app"
          echo "signed=1" >> "$GITHUB_ENV"

      - name: Make .dmg
        if: runner.os == 'macOS'
        run: |
          DMG="dist/LimitlessVoice-${{ steps.v.outputs.version }}-${{ matrix.label }}.dmg"
          mkdir dmg && cp -R "dist/Limitless Voice.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Limitless Voice" -srcfolder dmg -ov -format UDZO "$DMG"
          if [ "${signed:-}" = "1" ]; then
            codesign --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
            xcrun stapler staple "$DMG"
          fi

      # ---- Windows: installer -----------------------------------------
      - name: Make Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} installer\windows.iss

      - name: Smoke test the built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/Limitless Voice/LimitlessVoice.exe"
          else
            BIN="dist/Limitless Voice.app/Contents/MacOS/Limitless Voice"
          fi
          # exit code 0 means the phrase matched a command (a windowed app has no console output)
          "$BIN" do --dry-run --app "Pro Tools" go to bar thirty two
          ! "$BIN" do --dry-run --app "Pro Tools" make me a sandwich

      - uses: actions/upload-artifact@v4
        with:
          name: LimitlessVoice-${{ matrix.label }}
          path: |
            apps/voice/dist/*.dmg
            apps/voice/dist/LimitlessVoiceSetup-*.exe

  # How well it understands real (synthetic) Mac voices, clean and noisy,
  # for each speech model we could ship. Results land on the run's summary page.
  # About 35 Mac minutes, so it only runs when started by hand (Actions > Run workflow).
  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download speech models
        run: |
          mkdir -p models
          for m in vosk-model-small-en-us-0.15 vosk-model-en-us-0.22-lgraph; do
            curl -sSfL -o m.zip "https://alphacephei.com/vosk/models/$m.zip"
            python -m zipfile -e m.zip models/ && rm m.zip
          done
      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/bench.py models/vosk-model-small-en-us-0.15 models/vosk-model-en-us-0.22-lgraph
      - uses: actions/upload-artifact@v4
        with:
          name: speech-benchmark
          path: apps/voice/bench.json

  # Publishes a release page with every installer. A new version in
  # limitless_voice/__init__.py merged to main releases itself (tag voice-v<version>);
  # pushing a voice-v* tag by hand works too. The repo's Latest release stays the suite.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/voice-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' limitless_voice/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "voice-v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release voice-v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          pattern: LimitlessVoice-*
          path: apps/voice/release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: voice-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Limitless Voice ${{ steps.v.outputs.version }}
          body_path: apps/voice/RELEASE.md
          make_latest: "false"
          files: apps/voice/release/*
