name: Panda Drums

on:
  push:
    branches: [main, panda-drums]
    tags: ["panda-drums-v*"]
    paths: ["apps/panda-drums/**", ".github/workflows/panda-drums.yml"]
  pull_request:
    paths: ["apps/panda-drums/**", ".github/workflows/panda-drums.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (panda-drums-v...) from an earlier run's installers, without building"
        required: false
        default: ""
      from_run:
        description: "The id of the run whose installers to publish"
        required: false
        default: ""

defaults:
  run:
    working-directory: apps/panda-drums

jobs:
  # Unit tests on Linux, then the render tool films the panda playing a groove.
  preview:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev xvfb ffmpeg
      - name: Build tests, render tool and the Linux VST3
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target PandaDrumsTests PandaDrumsRender
          cmake --build build --target PandaDrums_VST3 -j 2
      - name: Unit tests
        run: xvfb-run -a build/PandaDrumsTests_artefacts/Release/PandaDrumsTests
      - name: Validate the VST3 with pluginval (strictest, with the editor)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate "build/PandaDrums_artefacts/Release/VST3/Panda Drums.vst3"
      - name: Screenshots and demo video
        run: |
          xvfb-run -a build/PandaDrumsRender_artefacts/Release/PandaDrumsRender screenshots preview
          xvfb-run -a build/PandaDrumsRender_artefacts/Release/PandaDrumsRender video render 18
          ffmpeg -loglevel error -y -framerate 30 -i render/frames/%04d.png -i render/groove.wav \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -c:a aac -b:a 192k -shortest preview/panda-drums-demo.mp4
          cp render/groove.wav preview/
      - name: Promo video
        run: |
          python3 -m venv .venv && .venv/bin/pip install --quiet numpy pillow
          xvfb-run -a build/PandaDrumsRender_artefacts/Release/PandaDrumsRender promo promo
          .venv/bin/python art/promo.py promo docs/hero.jpg preview/Purafied-Panda-Drums-promo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Panda-Drums-preview
          path: apps/panda-drums/preview

  mac:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Apple silicon + Intel in one)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j 4 --target PandaDrums_AU PandaDrums_VST3 PandaDrums_Standalone PandaDrumsTests
      - name: Unit tests
        run: build/PandaDrumsTests_artefacts/Release/PandaDrumsTests
      - name: Sign (ad hoc) and validate the Audio Unit
        run: |
          art=build/PandaDrums_artefacts/Release
          for b in "$art/AU/Panda Drums.component" "$art/VST3/Panda Drums.vst3" "$art/Standalone/Panda Drums.app"; do
            codesign --force --deep --sign - "$b"
            # One binary for both: Apple silicon and Intel (an i9 Mac).
            lipo "$(find "$b/Contents/MacOS" -type f | head -1)" -verify_arch arm64 x86_64
            lipo -archs "$(find "$b/Contents/MacOS" -type f | head -1)"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$art/AU/Panda Drums.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i panda
          auval -strict -v aumu PDrm Pnds
      - name: Validate the VST3 with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests \
            --validate "build/PandaDrums_artefacts/Release/VST3/Panda Drums.vst3"
      - name: Package
        run: |
          version=$(sed -nE 's/^project\(PandaDrums VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          packaging/mac/build-pkg.sh build/PandaDrums_artefacts/Release "$version" "dist/Panda-Drums-$version-mac.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: Panda-Drums-mac
          path: apps/panda-drums/dist/*.pkg

  windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release --parallel --target PandaDrums_VST3 PandaDrums_Standalone PandaDrumsTests
      - name: Unit tests
        run: build/PandaDrumsTests_artefacts/Release/PandaDrumsTests.exe
      - name: Installer
        shell: pwsh
        run: |
          $env:APP_VERSION = (Select-String -Path CMakeLists.txt -Pattern 'project\(PandaDrums VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc packaging\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Panda-Drums-windows
          path: apps/panda-drums/dist/*.exe

  # A panda-drums-v* tag publishes what this run built; run by hand with a release_tag, it
  # publishes the installers an earlier run built (from_run), and the release makes the tag.
  release:
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/panda-drums-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    needs: [preview, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - if: ${{ inputs.from_run == '' || inputs.from_run == null }}
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - if: ${{ inputs.from_run != '' && inputs.from_run != null }}
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.pkg
            out/*.exe
            out/*.mp4
          name: Panda Drums ${{ inputs.release_tag || github.ref_name }}
          # The repo's Latest release is the Limitless Sound suite download.
          make_latest: "false"
          # A -beta or -rc tag is a test build, marked as a pre-release.
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-beta') || contains(inputs.release_tag || github.ref_name, '-rc') }}
          body: |
            **Mac** (Apple silicon and Intel, macOS 10.13 or later): open the `.pkg` and click through. It installs the Audio Unit, the VST3 and the app. It isn't signed by Apple yet, so the first time macOS refuses: System Settings > Privacy & Security > **Open Anyway**. In Logic, rescan in Plug-in Manager if it doesn't show under Instruments > The Panda Studios.

            **Windows:** run the `.exe`. SmartScreen: More info > Run anyway.

            **Playing along with a song:** turn on **Showtime sync** (top right of the Kit page). The panda then sees every hit coming, and your DAW's delay compensation lines him up with the track.
