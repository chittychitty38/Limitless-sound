# Temporary: finds what keeps GazeStage busy while it sits idle on a Mac
# (the proof's 7.5% on Apple silicon and 3.4% on Intel; the limit is 3%).
name: Diagnose GazeStage idle CPU

on:
  push:
    branches: [diag/gazestage-idle]

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, artifact: GazeStage-mac-apple-silicon }
          - { os: macos-15-intel, artifact: GazeStage-mac-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GazeStage 0.3.5 as built for PR #60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39833562842 -R "$GITHUB_REPOSITORY" -n "${{ matrix.artifact }}" -D "$RUNNER_TEMP/dl"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dl/*.dmg
          cp -R "$RUNNER_TEMP/mnt/GazeStage.app" "$RUNNER_TEMP/"
          xattr -cr "$RUNNER_TEMP/GazeStage.app"
      - name: Measure
        working-directory: .github/diag
        run: |
          npm init -y >/dev/null && npm install --no-save playwright@1.56.1 >/dev/null
          node gazestage-idle.cjs "$RUNNER_TEMP/GazeStage.app/Contents/MacOS/GazeStage"
