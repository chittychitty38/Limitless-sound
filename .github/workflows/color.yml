name: Limitless Color

on:
  push:
    branches: [main]
    tags: ["color-v*"]
    paths: ["apps/color/**", ".github/workflows/color.yml"]
  pull_request:
    paths: ["apps/color/**", ".github/workflows/color.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/color

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p color-core

  mac:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            swift_arch: arm64
            artifact: Limitless-Color-mac-apple-silicon
          - runner: macos-15-intel
            arch: x86_64
            swift_arch: x86_64
            artifact: Limitless-Color-mac-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the screen filter helper
        run: |
          set -e
          mkdir -p app/src-tauri/binaries
          swiftc -O -target ${{ matrix.swift_arch }}-apple-macos13 app/macos-overlay/main.swift \
            -o app/src-tauri/binaries/limitless-overlay-${{ matrix.arch }}-apple-darwin
      - name: Smoke test the helper
        run: |
          out=$( (echo quit) | perl -e "alarm 30; exec @ARGV" app/src-tauri/binaries/limitless-overlay-${{ matrix.arch }}-apple-darwin || true)
          echo "helper said: $out"
          # CI machines may have no GPU; either answer proves the helper starts and reads commands.
          echo "$out" | grep -Eq '^(ready|error no-gpu)'
          # The one-shot permission check the setup guide uses must answer and exit.
          perm=$(perl -e "alarm 30; exec @ARGV" app/src-tauri/binaries/limitless-overlay-${{ matrix.arch }}-apple-darwin --check-permission)
          echo "permission check said: $perm"
          echo "$perm" | grep -Eq '^(granted|denied)$'
      - name: Build the app
        working-directory: apps/color/app
        run: npx --yes @tauri-apps/cli@2.9.4 build
      - name: Smoke test the app
        run: |
          set -e
          bin=target/release/limitless-color
          "$bin" --background &
          pid=$!
          sleep 15
          kill -0 $pid
          kill $pid
          ls target/release/bundle/dmg/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/color/target/release/bundle/dmg/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app
        working-directory: apps/color/app
        run: npx --yes @tauri-apps/cli@2.9.4 build
      - name: Smoke test the app and installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\limitless-color.exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          $setup = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "The installer failed with code $($i.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Limitless-Color-windows
          path: apps/color/target/release/bundle/nsis/*.exe

  # On main, publish color-v<version> once per new version (bump app/src-tauri/tauri.conf.json).
  # A pushed color-v* tag publishes that tag.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/color-v'))
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          version=$(jq -r .version apps/color/app/src-tauri/tauri.conf.json)
          case "$GITHUB_REF" in refs/tags/color-v*) version="${GITHUB_REF#refs/tags/color-v}";; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "color-v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release color-v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          pattern: Limitless-Color-*
          path: dist
      - name: Name the downloads the same way every release
        if: steps.v.outputs.publish == 'true'
        run: |
          set -e
          mkdir out
          mv dist/Limitless-Color-mac-apple-silicon/*.dmg out/Limitless-Color-mac-apple-silicon.dmg
          mv dist/Limitless-Color-mac-intel/*.dmg out/Limitless-Color-mac-intel.dmg
          mv dist/Limitless-Color-windows/*.exe out/Limitless-Color-Setup-windows.exe
          ls -l out
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: color-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Limitless Color ${{ steps.v.outputs.version }}
          fail_on_unmatched_files: true
          # The repo's Latest release is the whole-suite download.
          make_latest: "false"
          files: |
            out/*.dmg
            out/*.exe
          body: |
            Recolors the whole screen for colorblind musicians. Describe what looks wrong ("the red meters look yellow") and it tunes the colors, asking what you see now until it's right. Works in any app and any plug-in.

            | Computer | Download |
            | --- | --- |
            | Mac with Apple Silicon (M1 or later) | `Limitless-Color-mac-apple-silicon.dmg` |
            | Mac with Intel | `Limitless-Color-mac-intel.dmg` |
            | Windows 10 or 11 | `Limitless-Color-Setup-windows.exe` (installer) |

            **Mac, first launch:** open the .dmg, drag Limitless Color to Applications and open it. If macOS says it can't be opened, go to System Settings › Privacy & Security and click **Open Anyway**. This happens once. The setup guide then tunes your colors and helps you allow Screen Recording, which it uses only to recolor the screen. The screen is never recorded or sent anywhere.

            **Windows, first launch:** if SmartScreen appears, choose More info › Run anyway. No administrator rights are needed.

            Limitless Color is also in the [whole-suite Mac download](https://github.com/${{ github.repository }}/releases/latest). The [guide](https://github.com/${{ github.repository }}/tree/main/apps/color#readme) covers every option.
