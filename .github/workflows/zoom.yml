name: Limitless Zoom

on:
  push:
    branches: [main]
    tags: ["zoom-v*"]
    paths: ["apps/zoom/**", ".github/workflows/zoom.yml"]
  pull_request:
    paths: ["apps/zoom/**", ".github/workflows/zoom.yml"]
  workflow_dispatch:

# A newer push to the same pull request replaces the run still going for the older one.
concurrency:
  group: zoom-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MODEL: vosk-model-small-en-us-0.15

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            name: mac-apple-silicon
          - os: macos-15-intel  # Intel Macs
            name: mac-intel
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/zoom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Get the offline voice model
        shell: bash
        run: |
          mkdir -p models
          curl -sSL -o model.zip "https://alphacephei.com/vosk/models/$MODEL.zip"
          unzip -q model.zip -d models && rm model.zip

      - name: Make test recordings (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p wavs
          for p in "zoom in" "zoom out" "taller" "zoom to fit" "magnifier" "again"; do
            say --file-format=WAVE --data-format=LEI16@16000 -o "wavs/${p// /_}.wav" "$p"
          done
      - name: Make test recordings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          New-Item -ItemType Directory -Force wavs | Out-Null
          foreach ($p in "zoom in","zoom out","taller","zoom to fit","magnifier","again") {
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, 'Sixteen', 'Mono')
            $s.SetOutputToWaveFile("wavs\$($p -replace ' ','_').wav", $fmt)
            $s.Speak($p); $s.Dispose()
          }
      - name: Voice recognition check
        run: python packaging/voice_check.py models/${{ env.MODEL }} wavs

      - name: Build app
        run: pyinstaller --noconfirm packaging/limitless_zoom.spec

      - name: Self test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          # One consistent ad-hoc signature, so macOS remembers the permissions you grant.
          codesign --force --deep --sign - "dist/Limitless Zoom.app"
          codesign --verify --deep --strict "dist/Limitless Zoom.app"
          "dist/Limitless Zoom.app/Contents/MacOS/Limitless Zoom" --selftest
          # Drag-to-Applications disk image with a short how-to-open note.
          mkdir -p dmg
          cp -R "dist/Limitless Zoom.app" dmg/
          ln -s /Applications dmg/Applications
          cp "packaging/How to open on a Mac.txt" dmg/
          hdiutil create -volname "Limitless Zoom" -srcfolder dmg \
            -ov -format UDZO "dist/Limitless-Zoom-${{ matrix.name }}.dmg"
      - name: Self test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Limitless Zoom\Limitless Zoom.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed" }
          $env:APP_VERSION = (python -c "import limitless_zoom; print(limitless_zoom.__version__)")
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc packaging\windows.iss
          Move-Item "dist\Limitless Zoom Setup.exe" "dist\Limitless-Zoom-Setup-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Limitless-Zoom-${{ matrix.name }}
          path: |
            apps/zoom/dist/*.dmg
            apps/zoom/dist/*.exe

  # On main, publish zoom-v<version> once per new version (bump limitless_zoom/__init__.py).
  # A pushed zoom-v* tag publishes that tag.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/zoom-v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' apps/zoom/limitless_zoom/__init__.py)
          case "$GITHUB_REF" in refs/tags/zoom-v*) version="${GITHUB_REF#refs/tags/zoom-v}";; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "zoom-v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release zoom-v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          pattern: Limitless-Zoom-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: zoom-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Limitless Zoom ${{ steps.v.outputs.version }}
          fail_on_unmatched_files: true
          # The repo's Latest release is the whole-suite download.
          make_latest: "false"
          files: |
            out/*.dmg
            out/*.exe
          body: |
            Zoom the DAW or the whole screen by voice, a one-hand key layer, resting your pointer on big buttons, or a single switch. Every action is shown in large text and said out loud. Works offline.

            | Computer | Download |
            | --- | --- |
            | Mac with Apple Silicon (M1 or later) | `Limitless-Zoom-mac-apple-silicon.dmg` |
            | Mac with Intel | `Limitless-Zoom-mac-intel.dmg` |
            | Windows 10 or 11 | `Limitless-Zoom-Setup-windows.exe` (installer) |

            **Mac, first launch:** open the .dmg, drag Limitless Zoom to Applications and open it. If macOS says it can't check the app, go to System Settings › Privacy & Security and click **Open Anyway**. This happens once.

            **Windows, first launch:** if SmartScreen appears, choose More info › Run anyway.

            Limitless Zoom is also in the [whole-suite Mac download](https://github.com/${{ github.repository }}/releases/latest). The [guide](https://github.com/${{ github.repository }}/tree/main/apps/zoom#readme) covers every command.
