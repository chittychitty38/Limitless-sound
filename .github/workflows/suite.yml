# One download for the whole suite: collects the newest build of every app (from each app's
# own workflow on main) into one Mac installer, Limitless-Sound-Suite-<arch>.pkg (and the same
# installer in a disk image, .dmg), and one Windows installer, Limitless-Sound-Suite-windows.exe.
name: Limitless Sound Suite

on:
  workflow_run:
    workflows: ["Hub and clients", "Limitless Voice", "Limitless One-Hand", "Limitless Zoom",
                "Limitless Color", "Limitless Control", "GazeStage"]
    types: [completed]
    branches: [main]
  # A new packaging/VERSION reaching main publishes that suite version (like the apps' own
  # releases); merge it after the app releases it should carry have built.
  push:
    branches: [main]
    paths: ["packaging/VERSION", "packaging/RELEASE.md", "packaging/mac/**", "packaging/windows/**"]
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/suite.yml", ".github/scripts/newest-builds.sh"]
  workflow_dispatch:

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  mac:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: mac-apple-silicon
          - os: macos-15-intel
            arch: mac-intel
    runs-on: ${{ matrix.os }}
    # Signing and notarizing (with the secrets) take a while longer than the build alone.
    timeout-minutes: 90
    # Signing happens only when these secrets exist (SIGNING.md); without them the apps are
    # ad-hoc signed and the installer unsigned, as before.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_APPLE_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download every app's newest Mac build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/newest-builds.sh "${{ matrix.arch }}" in
          find in -maxdepth 3 | sed 's/^/  /'
      - name: Get the signing certificates ready (only if the Apple secrets are set)
        if: env.HAS_APPLE_CERT == 'true' || env.HAS_APPLE_INSTALLER_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: .github/scripts/mac-sign.sh keychain
      - name: Build the suite disk image
        env:
          SIGN_APPS: ${{ env.HAS_APPLE_CERT }}
          SIGN_PKG: ${{ env.HAS_APPLE_INSTALLER_CERT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/mac/build-suite-dmg.sh in "${{ matrix.arch }}" "Limitless-Sound-Suite-${{ matrix.arch }}.dmg"
      - name: Install it on this Mac, as a musician would, and check every app
        run: |
          pkg="Limitless-Sound-Suite-${{ matrix.arch }}.pkg"
          if [ "$HAS_APPLE_INSTALLER_CERT" = true ]; then
            pkgutil --check-signature "$pkg"
            spctl --assess --type install -vv "$pkg" || echo "::warning::Gatekeeper doesn't accept the installer yet (is it notarized? APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD)"
          fi
          sudo installer -pkg "$pkg" -target / -verboseR
          for app in "Limitless Sound" "Limitless Voice" "Limitless One-Hand" "Limitless Zoom" \
                     "Limitless Color" "Limitless Control" "GazeStage"; do
            bundle="/Applications/$app.app"
            [ -d "$bundle" ] || { echo "::error::$app wasn't installed"; exit 1; }
            exe="$bundle/Contents/MacOS/$(defaults read "$bundle/Contents/Info" CFBundleExecutable)"
            file "$exe" | sed "s|/Applications/||"
            codesign --verify --deep "$bundle" && echo "  signature ok: $app"
            if [ "$HAS_APPLE_CERT" = true ]; then
              codesign -dvv "$bundle" 2>&1 | grep -m1 '^Authority=' | sed 's/^/  /'
            fi
          done
          # The disk image holds the same installer.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "Limitless-Sound-Suite-${{ matrix.arch }}.dmg" >/dev/null
          ls -1 "$mnt"
          test -f "$mnt/Install Limitless Sound.pkg"
          hdiutil detach "$mnt" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: Limitless-Sound-Suite-${{ matrix.arch }}
          path: |
            Limitless-Sound-Suite-${{ matrix.arch }}.dmg
            Limitless-Sound-Suite-${{ matrix.arch }}.pkg

  # The same for Windows: one installer that runs every app's own installer quietly, for the
  # person signed in, then turns on Limitless Sound.
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    # Signing happens only when these secrets exist (SIGNING.md); without them it's unsigned.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every app's newest Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/newest-builds.sh windows in
          find in -name "*.exe" | sed 's/^/  /'
      # An app built before the certificate existed has an unsigned installer: sign it here.
      - name: Sign every app's installer not signed yet (only if the Windows secrets are set)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $installers = (Get-ChildItem in -Recurse -Filter *.exe).FullName
          & .github\scripts\win-sign.ps1 -SkipSigned @installers
      - name: Build the suite installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = (Get-Content packaging\VERSION -Raw).Trim()
          python packaging\windows\build_suite.py in $version out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sign the suite installer (only if the Windows secrets are set)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: '& .github\scripts\win-sign.ps1 out\Limitless-Sound-Suite-windows.exe'
      - name: Install it on this PC, as a musician would, and check every app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out\Limitless-Sound-Suite-windows.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=suite-install.log" -PassThru
          $null = $p.Handle  # keeps the exit code readable after it exits
          # Wait for the installer itself: -Wait would also wait for any app an installer opens.
          $done = $p.WaitForExit(900000)
          Get-Content suite-install.log -Tail 40
          if (-not $done) { $p.Kill(); throw "The suite installer was still running after 15 minutes" }
          if ($p.ExitCode -ne 0) { throw "The suite installer failed with code $($p.ExitCode)" }
          # Find each app the way the hub does when someone presses Open.
          $env:PYTHONPATH = "shared\hub"
          python -c "from limitless_hub import catalog; missing = [t for t in catalog.TOOLS if catalog.find_install(t) is None]; [print(f'{t}: {catalog.find_install(t)}') for t in catalog.TOOLS if t not in missing]; assert not missing, f'not installed: {missing}'"
          $hub = Join-Path $env:LOCALAPPDATA "Programs\Limitless Sound\Limitless Sound.exe"
          if (-not (Test-Path $hub)) { throw "Limitless Sound itself wasn't installed" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Limitless Sound" -ErrorAction SilentlyContinue
          if (-not $run) { throw "Limitless Sound wasn't set to start at sign-in" }
          "starts at sign-in: $($run.'Limitless Sound')"
      - uses: actions/upload-artifact@v4
        with:
          name: Limitless-Sound-Suite-windows
          path: out/Limitless-Sound-Suite-windows.exe

  # One release page for the whole suite: v<packaging/VERSION>. The first build of a new
  # version publishes it; later builds of the same version refresh its disk images, so the
  # download always carries every app's newest version. Its assets keep the same names, so
  # https://github.com/<repo>/releases/latest/download/Limitless-Sound-Suite-<arch>.pkg
  # (and the .dmg holding the same installer) stay permanent links.
  release:
    needs: [mac, windows]
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Limitless-Sound-Suite-*
          path: out
          merge-multiple: true
      - name: Publish or refresh the suite release
        run: |
          version=$(tr -d '[:space:]' < packaging/VERSION)
          tag="v$version"
          ls -l out
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" out/*.pkg out/*.dmg out/*.exe --clobber -R "$GITHUB_REPOSITORY"
            echo "Refreshed $tag with the newest apps."
          else
            gh release create "$tag" out/*.pkg out/*.dmg out/*.exe -R "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "Limitless Sound $version" --notes-file packaging/RELEASE.md --latest
            echo "Published $tag."
          fi
