# Temporary: what keeps Limitless Control busy while it sits idle on a Mac
# (the 0.2.2 proof: 2.8% on Intel, 1.3% on Apple silicon; the limit is 3%).
name: Diagnose Control idle CPU

on:
  push:
    branches: [diag/control-idle]

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, dmg: LimitlessControl-mac-intel.dmg }
          - { os: macos-15, dmg: LimitlessControl-mac-apple-silicon.dmg }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Each part of the loop on its own (from source)
        env:
          SDL_AUDIODRIVER: dummy
          SDL_MAC_BACKGROUND_APP: "1"
        run: |
          pip install ./apps/control >/dev/null
          python .github/diag/control_parts.py
      - name: The released app, sitting idle
        env:
          GH_TOKEN: ${{ github.token }}
          SDL_AUDIODRIVER: dummy
          SDL_MAC_BACKGROUND_APP: "1"
        run: |
          pip install py-spy >/dev/null
          gh release download control-v0.2.3 -R "$GITHUB_REPOSITORY" -p "${{ matrix.dmg }}" -D "$RUNNER_TEMP"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/${{ matrix.dmg }}"
          cp -R "$RUNNER_TEMP/mnt/Limitless Control.app" "$RUNNER_TEMP/"
          xattr -cr "$RUNNER_TEMP/Limitless Control.app"
          export LIMITLESS_SOUND_LOGS="$RUNNER_TEMP/logs"
          "$RUNNER_TEMP/Limitless Control.app/Contents/MacOS/Limitless Control" --background > run.log 2>&1 &
          pid=$!
          sleep 30
          for w in 1 2 3; do
            a=$(ps -o time= -p "$pid"); sleep 15; b=$(ps -o time= -p "$pid")
            echo "$a $b" | awk -v w=$w 'function s(t, n, p, i, x) { n = split(t, p, ":"); x = 0; for (i = 1; i <= n; i++) x = x * 60 + p[i]; return x }
              { printf "window %d: %.1f%%\n", w, (s($2) - s($1)) / 15 * 100 }'
          done
          spy="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/py-spy"
          sudo "$spy" record -p "$pid" -d 30 -r 100 -f raw --threads -o spy.txt --nonblocking >/dev/null 2>&1 || true
          echo "== Busiest Python stacks in 30 s (100 samples a second, sleeping ones left out):"
          awk '{ c = $NF; $NF = ""; print c "\t" $0 }' spy.txt | sort -nr | head -25 | cut -c1-600
          ps -M -p "$pid" | head -30
          kill "$pid" || true
          cat run.log | tail -20
