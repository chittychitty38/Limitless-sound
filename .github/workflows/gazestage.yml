name: GazeStage

on:
  push:
    branches: [main]
    tags: ["gazestage-v*"]
    paths: ["apps/gazestage/**", ".github/workflows/gazestage.yml"]
  pull_request:
    paths: ["apps/gazestage/**", ".github/workflows/gazestage.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/gazestage

# A newer push to the same pull request replaces the run still going for the older one.
concurrency:
  group: gazestage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gazestage/package-lock.json
      - run: npm ci
      - run: xvfb-run -a npm test

  package:
    name: package (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, script: dist:mac-arm64, artifact: GazeStage-mac-apple-silicon, files: "dist/*.dmg" }
          - { os: macos-15-intel, script: dist:mac-x64, artifact: GazeStage-mac-intel, files: "dist/*.dmg" }
          - { os: windows-latest, script: dist:win, artifact: GazeStage-windows, files: "dist/*.exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder skips signing on pull requests by default, which leaves the Mac app
      # with a broken signature. Ours is an ad-hoc signature with no secrets, so it is safe here.
      # (With the secrets below, pull requests from forks still get no secrets, so no signing.)
      CSC_FOR_PULL_REQUEST: "true"
      # Signing with certificates happens only when these secrets exist (SIGNING.md).
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gazestage/package-lock.json
      - run: npm ci
      # Without the secrets: exactly `npm run <script>`, ad-hoc signed on the Mac. With them,
      # electron-builder signs with the Developer ID (hardened runtime, the camera and microphone
      # entitlements) and notarizes the app, and signs the Windows app and installer.
      - name: Build
        shell: bash
        env:
          LS_APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          LS_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          LS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          LS_APPLE_ID: ${{ secrets.APPLE_ID }}
          LS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          LS_WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          LS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          signing=()
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE_CERT" = true ]; then
            [ -n "$LS_APPLE_SIGNING_IDENTITY" ] || { echo "::error::Set the APPLE_SIGNING_IDENTITY secret too (SIGNING.md)"; exit 1; }
            export CSC_LINK="$LS_APPLE_CERT_P12" CSC_KEY_PASSWORD="$LS_APPLE_CERT_PASSWORD"
            # electron-builder wants the name without its "Developer ID Application: " start.
            signing+=("-c.mac.identity=${LS_APPLE_SIGNING_IDENTITY#Developer ID Application: }"
                      -c.mac.hardenedRuntime=true -c.forceCodeSigning=true
                      -c.mac.entitlements=packaging/mac-entitlements.plist
                      -c.mac.entitlementsInherit=packaging/mac-entitlements.plist)
            if [ -n "$LS_APPLE_ID" ]; then
              export APPLE_ID="$LS_APPLE_ID" APPLE_TEAM_ID="$LS_APPLE_TEAM_ID" APPLE_APP_SPECIFIC_PASSWORD="$LS_APPLE_APP_PASSWORD"
            else
              echo "::notice title=Signing::Notarization skipped: APPLE_ID isn't set"
            fi
          fi
          if [ "$RUNNER_OS" = Windows ] && [ "$HAS_WINDOWS_CERT" = true ]; then
            export WIN_CSC_LINK="$LS_WINDOWS_CERT_PFX" WIN_CSC_KEY_PASSWORD="$LS_WINDOWS_CERT_PASSWORD"
            signing+=(-c.forceCodeSigning=true)
          fi
          if [ ${#signing[@]} -gt 0 ]; then
            npm run ${{ matrix.script }} -- "${signing[@]}"
          else
            npm run ${{ matrix.script }}
          fi
      # Ad-hoc signed until the project has an Apple Developer ID; check the signature holds.
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/mac*/GazeStage.app
      - name: Check the Developer ID signature (macOS, only if the Apple secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        run: '"$GITHUB_WORKSPACE/.github/scripts/mac-sign.sh" verify dist/mac*/GazeStage.app'
      - name: Check the signatures (Windows, only if the Windows secrets are set)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          foreach ($sig in Get-ChildItem dist\*.exe, dist\win-unpacked\GazeStage.exe | Get-AuthenticodeSignature) {
            "$(Split-Path -Leaf $sig.Path): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "$($sig.Path) isn't signed" }
          }
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/gazestage/${{ matrix.files }}
          if-no-files-found: error

  # Publishes the installers once per version. A merge to main that brings a new version in
  # package.json releases it as gazestage-v<version>; later merges at the same version skip.
  # Pushing a gazestage-v* tag by hand still works too.
  release:
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/gazestage-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="gazestage-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/tags/$tag" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GazeStage $version is already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: apps/gazestage/release
          merge-multiple: true
      - if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GazeStage ${{ steps.version.outputs.version }}
          # The repo's Latest release stays the whole-suite download.
          make_latest: "false"
          files: apps/gazestage/release/*
          body: |
            Play music and run Pro Tools with your head, your eyes, a short sound or a switch.

            | Computer | Download |
            | --- | --- |
            | Mac with Apple Silicon (M1 or later) | `GazeStage-${{ steps.version.outputs.version }}-mac-arm64.dmg` |
            | Mac with Intel | `GazeStage-${{ steps.version.outputs.version }}-mac-x64.dmg` |
            | Windows PC | `GazeStage-${{ steps.version.outputs.version }}-win-x64.exe` |

            **Mac, first launch:** open the .dmg, drag GazeStage to Applications and open it. If macOS says it can't check the developer, go to System Settings › Privacy & Security and click **Open Anyway**. This happens once.

            The [setup guide](https://github.com/${{ github.repository }}/tree/main/apps/gazestage#readme) covers connecting Pro Tools.
