name: GazeStage

on:
  push:
    branches: [main]
    paths: ['apps/gazestage/**', '.github/workflows/gazestage.yml']
  pull_request:
    paths: ['apps/gazestage/**', '.github/workflows/gazestage.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/gazestage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gazestage/package-lock.json
      - run: npm ci
      - run: xvfb-run -a npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: mac-arm64, dir: GazeStage-darwin-arm64, name: GazeStage-mac-apple-silicon }
          - { os: macos-latest, target: mac-x64, dir: GazeStage-darwin-x64, name: GazeStage-mac-intel }
          - { os: windows-latest, target: win-x64, dir: GazeStage-win32-x64, name: GazeStage-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gazestage/package-lock.json
      - run: npm ci
      - run: npm run package:${{ matrix.target }}
      # Ad-hoc signature: required for Apple Silicon to launch at all. A Developer ID
      # certificate and notarization replace this once the project has one.
      - if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/${{ matrix.dir }}/GazeStage.app"
      - if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "${{ matrix.dir }}/GazeStage.app" "${{ matrix.name }}.zip"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.dir }}" -DestinationPath "dist/${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/gazestage/dist/${{ matrix.name }}.zip
          if-no-files-found: error
