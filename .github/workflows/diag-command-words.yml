# Temporary: shows stress/tools/get_command_words.py fetching real people saying Voice's command
# words (MSWC, CC BY 4.0) on a GitHub runner. Lives only on the diag/command-words branch.
name: Diag command words

on:
  push:
    branches: [diag/command-words]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy soundfile
      - name: Fetch the command words
        shell: bash
        run: |
          start=$(date +%s)
          python stress/tools/get_command_words.py command-words
          echo "wall time: $(( $(date +%s) - start )) s"
      - name: Check what was written
        shell: bash
        run: |
          du -sh command-words
          python - <<'EOF'
          import csv, wave
          from collections import defaultdict
          from pathlib import Path
          out = Path("command-words")
          rows = list(csv.DictReader(open(out / "clips.csv")))
          by_word = defaultdict(list)
          for r in rows:
              by_word[r["word"]].append(r)
          bad = 0
          lines = ["| word | clips | different people | women / men / other or unsaid | MB |", "|---|---|---|---|---|"]
          for word in sorted(by_word):
              files = sorted((out / word).glob("*.wav"))
              for f in files:
                  with wave.open(str(f)) as w:
                      if (w.getframerate(), w.getnchannels(), w.getsampwidth()) != (16000, 1, 2) or not 15000 <= w.getnframes() <= 17000:
                          bad += 1
              rs = by_word[word]
              people = {r["speaker"] for r in rs}
              g = [r["gender"] for r in rs]
              size = sum(f.stat().st_size for f in files) / 1e6
              lines.append(f"| {word} | {len(files)} | {len(people)} | {g.count('FEMALE')} / {g.count('MALE')} / {len(g) - g.count('FEMALE') - g.count('MALE')} | {size:.1f} |")
              assert len(files) == len(rs), word
          total = sum(f.stat().st_size for f in out.rglob("*") if f.is_file()) / 1e6
          lines.append(f"\n{len(rows)} clips, {total:.0f} MB; {bad} not 16 kHz mono 16-bit and about a second long")
          print("\n".join(lines))
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          assert bad == 0
          EOF
      - name: Other places MSWC lives (for reference only)
        continue-on-error: true
        shell: bash
        run: |
          curl -sS -m 30 "https://huggingface.co/api/datasets/MLCommons/ml_spoken_words?blobs=true" -o hf.json || true
          python - <<'EOF' || true
          import json
          d = json.load(open("hf.json"))
          print("HF card license:", d.get("cardData", {}).get("license"), "gated:", d.get("gated"))
          sib = d.get("siblings", [])
          en = [s for s in sib if "/en" in s["rfilename"] or s["rfilename"].startswith("data/en")]
          print(len(sib), "files;", len(en), "English-looking; e.g.", [s["rfilename"] for s in sib[:8]])
          print("English sizes (GB):", round(sum(s.get("size") or 0 for s in en) / 1e9, 1))
          EOF
          curl -sS -m 30 "https://huggingface.co/datasets/MLCommons/ml_spoken_words/raw/main/README.md" | sed -n '1,40p' | grep -i -E "license|cc-by|attribution" || true
          curl -sSL -m 30 "https://mlcommons.org/datasets/multilingual-spoken-words/" | grep -o -i -E "CC[- ]BY[^<\"]{0,60}|creative commons[^<\"]{0,60}" | sort | uniq -c | head || true
