name: Stress tests

# Every app pushed hard: floods, tremor, held keys, noise and mishearing, hung and crashing
# apps, lost focus, and long soaks. Apps whose folder isn't in the checkout yet are skipped.
# Pull requests run short soaks; the nightly run and a manual run go long.

on:
  pull_request:
    paths: ["apps/**", "shared/**", "stress/**", ".github/workflows/stress.yml", "!**/*.md"]
  push:
    branches: [main]
    paths: ["apps/**", "shared/**", "stress/**", ".github/workflows/stress.yml", "!**/*.md"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long each soak runs, in seconds"
        default: "600"

# A newer push to the same pull request replaces the run still going for the older one.
concurrency:
  group: stress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STRESS_SECONDS: ${{ github.event_name == 'pull_request' && '20' || github.event.inputs.seconds || '600' }}
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"   # Windows consoles default to cp1252; the reports print arrows and µ

jobs:
  # On a pull request, each job runs only when something it tests changed: that app, its own
  # stress tests, what they share, or this workflow. macOS runners are few (five at once for the
  # whole repo), so a change to one app's tests shouldn't queue every app's jobs behind them.
  # Main, the nightly run and a manual run always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.diff.outputs.engines }}
      voice: ${{ steps.diff.outputs.voice }}
      gazestage: ${{ steps.diff.outputs.gazestage }}
      color: ${{ steps.diff.outputs.color }}
      zoom: ${{ steps.diff.outputs.zoom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for job in engines voice gazestage color zoom; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD | grep -v '\.md$' || true)"
          echo "$changed"
          everything='^(stress/conftest\.py|\.github/workflows/stress\.yml)'
          # The speech benchmarks need a speech model, which only the speech jobs fetch: the
          # engine jobs would skip them anyway.
          speech='^stress/(test_voice_real_speech\.py|test_zoom_real_speech\.py|test_zoom_noise\.py|test_command_words\.py|tools/)'
          declare -A own=(
            [engines]="^(apps/|shared/|stress/)"
            [voice]="^(apps/voice/|stress/(test_voice_|test_command_words|tools/))"
            [zoom]="^(apps/zoom/|stress/(test_zoom_|test_command_words|tools/))"
            [gazestage]="^(apps/gazestage/|stress/gazestage_)"
            [color]="^(apps/color/|stress/color/)"
          )
          for job in engines voice gazestage color zoom; do
            mine="$(grep -E "${own[$job]}" <<< "$changed" || true)"
            [ "$job" = engines ] && mine="$(grep -vE "$speech" <<< "$mine" || true)"
            if grep -qE "$everything" <<< "$changed" || [ -n "$mine" ]; then
              echo "$job=true" >> "$GITHUB_OUTPUT"
            else
              echo "$job=false" >> "$GITHUB_OUTPUT"
            fi
          done

  engines:
    name: Engines and hub (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engines == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest psutil numpy pyyaml platformdirs pygame-ce==2.5.8
      - run: python -m pytest stress -v -s --durations=10

  voice-recognizer:
    name: Voice and Zoom vs noise and music (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    needs: changes
    if: needs.changes.outputs.voice == 'true' || needs.changes.outputs.zoom == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MODEL: vosk-model-small-en-us-0.15
    steps:
      - uses: actions/checkout@v4
      - id: has
        shell: bash
        run: echo "voice=$([ -f apps/voice/limitless_voice/engine.py ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.voice == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.has.outputs.voice == 'yes'
        uses: actions/cache@v4
        with:
          path: models
          key: vosk-${{ env.MODEL }}
      - if: steps.has.outputs.voice == 'yes'
        name: Install, fetch the speech model the app ships, make spoken clips
        shell: bash
        run: |
          pip install pytest psutil numpy pyyaml platformdirs vosk==0.3.44
          if [ ! -d "models/$MODEL" ]; then
            mkdir -p models
            curl -sSfL -o model.zip "https://alphacephei.com/vosk/models/${MODEL}.zip"
            python -m zipfile -e model.zip models/
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng; fi
          python stress/tools/make_speech.py "$RUNNER_TEMP/speech"
      - if: steps.has.outputs.voice == 'yes'
        shell: bash
        # The recognizer warns about every command word the small model doesn't know each time
        # it's built; each warning is shown once.
        run: |
          VOSK_MODEL="$PWD/models/$MODEL" TTS_WAV_DIR="$RUNNER_TEMP/speech" \
            python -m pytest stress/test_voice_stress.py stress/test_zoom_noise.py -v -s 2>&1 \
            | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'

  # Voice and Zoom hearing real people instead of a synthetic voice: Google Speech Commands
  # (single words, thousands of speakers) for how often a command is heard, LibriSpeech
  # (an hour of people reading aloud) for how often ordinary talk fires one, and the
  # Multilingual Spoken Words Corpus for the command words Speech Commands doesn't have
  # ("record", "cut", "paste" ...). All CC BY 4.0, fetched once and cached, never committed.
  # stress/tools/get_real_speech.py and get_command_words.py say what's kept.
  voice-real-speech:
    name: Voice and Zoom vs real people (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.voice == 'true' || needs.changes.outputs.zoom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35   # about 20 with the recordings cached, a few minutes more without
    env:
      MODEL: vosk-model-small-en-us-0.15
    steps:
      - uses: actions/checkout@v4
      - id: has
        shell: bash
        run: echo "voice=$([ -f apps/voice/limitless_voice/engine.py ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.voice == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.has.outputs.voice == 'yes'
        uses: actions/cache@v4
        with:
          path: models
          key: vosk-${{ env.MODEL }}
      # Restored and saved as separate steps, so a failing test still keeps the download.
      - if: steps.has.outputs.voice == 'yes'
        id: data
        uses: actions/cache/restore@v4
        with:
          path: real-speech
          key: real-speech-${{ hashFiles('stress/tools/get_real_speech.py') }}
      - if: steps.has.outputs.voice == 'yes'
        id: words
        uses: actions/cache/restore@v4
        with:
          path: command-words
          key: command-words-${{ hashFiles('stress/tools/get_command_words.py') }}
      - if: steps.has.outputs.voice == 'yes'
        name: Install, fetch the speech model the app ships and the recordings
        shell: bash
        run: |
          pip install pytest psutil numpy pyyaml platformdirs vosk==0.3.44 soundfile
          if [ ! -d "models/$MODEL" ]; then
            mkdir -p models
            curl -sSfL -o model.zip "https://alphacephei.com/vosk/models/${MODEL}.zip"
            python -m zipfile -e model.zip models/
          fi
          if [ "${{ steps.data.outputs.cache-hit }}" != "true" ]; then
            python stress/tools/get_real_speech.py real-speech
          fi
          if [ "${{ steps.words.outputs.cache-hit }}" != "true" ]; then
            python stress/tools/get_command_words.py command-words
          fi
      - if: steps.has.outputs.voice == 'yes' && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: real-speech
          key: ${{ steps.data.outputs.cache-primary-key }}
      - if: steps.has.outputs.voice == 'yes' && steps.words.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: command-words
          key: ${{ steps.words.outputs.cache-primary-key }}
      - if: steps.has.outputs.voice == 'yes'
        shell: bash
        run: |
          # The recognizer warns about every command word the small model doesn't know each time
          # it's built, thousands of times here; each warning is shown once.
          VOSK_MODEL="$PWD/models/$MODEL" SPEECH_COMMANDS_DIR="$PWD/real-speech/speech_commands" \
            LIBRISPEECH_DIR="$PWD/real-speech/librispeech" COMMAND_WORDS_DIR="$PWD/command-words" \
            python -m pytest stress/test_voice_real_speech.py stress/test_zoom_real_speech.py \
              stress/test_command_words.py -v -s --durations=6 2>&1 \
            | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'

  gazestage:
    name: GazeStage soak and focus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    needs: changes
    if: needs.changes.outputs.gazestage == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "gaze=$([ -f apps/gazestage/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.gaze == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.has.outputs.gaze == 'yes'
        working-directory: apps/gazestage
        run: |
          npm ci
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node ../../stress/gazestage_stress.mjs
          else
            node ../../stress/gazestage_stress.mjs
          fi

  color:
    name: Color engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    needs: changes
    if: needs.changes.outputs.color == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: has
        shell: bash
        run: echo "color=$([ -f apps/color/crates/color-core/Cargo.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.color == 'yes'
        run: cargo test --release --manifest-path stress/color/Cargo.toml -- --nocapture
