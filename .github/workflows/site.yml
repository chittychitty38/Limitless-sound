# The website, in English and Spanish, must meet WCAG 2.2 AA: it's the front door for musicians
# with disabilities.
name: Website

on:
  pull_request:
    paths: ["docs/**", ".github/scripts/site-*", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["docs/**", ".github/scripts/site-*", ".github/workflows/site.yml"]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
      # The browser only: the runner already has the libraries headless Chromium needs, and
      # --with-deps fetched fonts and a virtual display from Ubuntu's mirror, which twice took the
      # whole 10 minutes (#118).
      - run: npx playwright install chromium
      - run: node .github/scripts/site-a11y.cjs
