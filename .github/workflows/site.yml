# The website, in English and Spanish, must meet WCAG 2.2 AA: it's the front door for musicians
# with disabilities.
name: Website

on:
  pull_request:
    paths: ["docs/**", ".github/scripts/site-*", ".github/workflows/site.yml", "netlify.toml", ".github/scripts/netlify-build.mjs"]
  push:
    branches: [main]
    paths: ["docs/**", ".github/scripts/site-*", ".github/workflows/site.yml", "netlify.toml", ".github/scripts/netlify-build.mjs"]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
      # The browser only: the runner already has the libraries headless Chromium needs, and
      # --with-deps fetched fonts and a virtual display from Ubuntu's mirror, which twice took the
      # whole 10 minutes (#118).
      - run: npx playwright install chromium
      - run: node .github/scripts/site-a11y.cjs
      # The site as Netlify builds it (netlify.toml): it must build, and find every app's release.
      - name: Build the website as Netlify does
        env:
          URL: https://example.netlify.app
        run: |
          node .github/scripts/netlify-build.mjs
          node -e 'const r = require("./_site/releases.json"); const n = Object.keys(r.apps).length;
            if (!r.suite || n !== 6) { console.error("releases.json:", JSON.stringify(r)); process.exit(1); }'
          grep -q 'rel="canonical" href="https://example.netlify.app/"' _site/index.html
          grep -q 'Sitemap: https://example.netlify.app/sitemap.xml' _site/robots.txt
