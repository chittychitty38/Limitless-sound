name: Limitless One-Hand

on:
  push:
    branches: [main]
    tags: ["one-hand-v*"]
    paths: ["apps/one-hand/**", ".github/workflows/one-hand.yml"]
  pull_request:
    paths: ["apps/one-hand/**", ".github/workflows/one-hand.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (for example 0.2.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/one-hand

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: Limitless-One-Hand-mac-apple-silicon
          - os: macos-15-intel
            artifact: Limitless-One-Hand-mac-intel
          - os: windows-latest
            artifact: Limitless-One-Hand-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.22.3 pillow==11.3.0 pytest
      - name: Test
        run: python -m pytest -q
      - name: Check the keyboard code from source
        run: python main.py --self-test
      - name: Build app
        run: pyinstaller --noconfirm onehand.spec

      - name: Smoke test the built app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          "dist/Limitless One-Hand.app/Contents/MacOS/Limitless One-Hand" --self-test
          "dist/Limitless One-Hand.app/Contents/MacOS/Limitless One-Hand" --ui-smoke
          codesign --verify --deep --strict "dist/Limitless One-Hand.app" && echo "signature ok"
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R "dist/Limitless One-Hand.app" dmg/
          cp "assets/How to open One-Hand.txt" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Limitless One-Hand" -srcfolder dmg -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"

      - name: Smoke test and installer (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($arg in "--self-test", "--ui-smoke") {
            $p = Start-Process -FilePath dist\LimitlessOneHand.exe -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg failed with exit code $($p.ExitCode)" }
          }
          $ref = "${{ github.ref_name }}"
          $env:APP_VERSION = if ("${{ inputs.release }}") { "${{ inputs.release }}" } elseif ($ref -like "one-hand-v*") { $ref.Substring(10) } else { "0.2.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/one-hand/dist/${{ matrix.artifact }}.dmg
            apps/one-hand/dist/${{ matrix.artifact }}.exe
          if-no-files-found: error

  # One job publishes the release after every build passed, so the three
  # builds never race to create it. A one-hand-v* tag push publishes that tag;
  # running the workflow by hand with a version creates the tag on this commit.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/one-hand-v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && format('one-hand-v{0}', inputs.release) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Limitless One-Hand ${{ inputs.release != '' && inputs.release || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            out/*.dmg
            out/*.exe
          body: |
            **Limitless One-Hand** lets you run Logic Pro and Pro Tools with one hand.

            **Download**
            - Mac with Apple Silicon (M1 and newer): `Limitless-One-Hand-mac-apple-silicon.dmg`
            - Mac with Intel: `Limitless-One-Hand-mac-intel.dmg`
            - Windows 10 and 11: `Limitless-One-Hand-windows.exe` (installer)

            **First time on a Mac:** open the .dmg and drag the app to Applications. One-Hand isn't signed by Apple yet, so the first time macOS may refuse to open it: open System Settings → Privacy & Security and click **Open Anyway**. A welcome page then walks you through the two keyboard permissions.

            **First time on Windows:** if SmartScreen appears, choose More info → Run anyway.

            Full guide: [apps/one-hand/README.md](https://github.com/${{ github.repository }}/blob/main/apps/one-hand/README.md)
