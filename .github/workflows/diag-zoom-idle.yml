# Temporary: finds what keeps the released Limitless Zoom busy while it sits idle on a Mac
# (the proof's 3.2% on Intel, 0.3% on Apple silicon; the limit is 3%).
name: Diagnose Zoom idle CPU

on:
  push:
    branches: [diag/zoom-idle]

jobs:
  diag:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the released Limitless Zoom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zoom-v0.1.2 -R "$GITHUB_REPOSITORY" -p Limitless-Zoom-mac-intel.dmg -D "$RUNNER_TEMP"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/Limitless-Zoom-mac-intel.dmg"
          cp -R "$RUNNER_TEMP/mnt/Limitless Zoom.app" "$RUNNER_TEMP/"
          xattr -cr "$RUNNER_TEMP/Limitless Zoom.app"
      - name: Measure, as the proof starts it
        timeout-minutes: 8
        run: |
          export LIMITLESS_SOUND_LOGS="$RUNNER_TEMP/logs"
          "$RUNNER_TEMP/Limitless Zoom.app/Contents/MacOS/Limitless Zoom" > zoom.log 2>&1 &
          pid=$!
          sleep 25
          threads() { ps -M -p "$pid" | tail -n +2 | awk 'NR==1 { print $7, $8; next } { print $(NF-1), $NF }'; }
          for w in 1 2 3 4; do
            threads > a.txt; sleep 15; threads > b.txt
            paste a.txt b.txt | awk -v w=$w '
              function s(t,  n, p, i, x) { n = split(t, p, ":"); x = 0; for (i = 1; i <= n; i++) x = x * 60 + p[i]; return x }
              { d = (s($3) + s($4)) - (s($1) + s($2)); tot += d; if (d >= 0.01) line = line sprintf(" t%d:%.2fs", NR, d) }
              END { printf "window %d: %.1f%%  busy threads:%s\n", w, tot / 15 * 100, line }'
          done
          echo "== spindump, 15 s:"
          sudo spindump "$pid" 15 10 -file sp.txt >/dev/null 2>&1 || true
          python3 .github/diag/spin.py sp.txt || head -100 sp.txt
          kill "$pid" || true
          echo "== Log"; cat zoom.log; cat "$LIMITLESS_SOUND_LOGS"/*.log 2>/dev/null | tail -20
      - name: Measure with voice off
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/Limitless Zoom.app/Contents/MacOS/Limitless Zoom" --no-voice > zoom2.log 2>&1 &
          pid=$!
          sleep 25
          for w in 1 2; do
            a=$(ps -o time= -p "$pid"); sleep 15; b=$(ps -o time= -p "$pid")
            echo "$a $b" | awk -v w=$w 'function s(t, n, p, i, x) { n = split(t, p, ":"); x = 0; for (i = 1; i <= n; i++) x = x * 60 + p[i]; return x }
              { printf "voice off, window %d: %.1f%%\n", w, (s($2) - s($1)) / 15 * 100 }'
          done
          kill "$pid" || true
