# Temporary: what listening to the microphone costs Limitless Zoom on a Mac sitting idle
# (Zoom: 3.2% on the proof's Intel Mac with voice on, 0.5% with it off; the limit is 3%).
name: Diagnose Zoom idle CPU

on:
  push:
    branches: [diag/zoom-idle]

jobs:
  mic:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$(grep -i '^sounddevice' apps/zoom/requirements.txt || echo sounddevice)"
      - run: python .github/diag/mic_cost.py
