name: Diag - which Vosk model

# Throwaway (branch diag/vosk-model, never merged). Would a larger offline Vosk model make
# Voice and Zoom hear real people better, and what would it cost on an older laptop?
# The real-people job from stress.yml, once per model, plus each model's cost: load and
# recognizer build time, decode CPU per second of audio, memory, size on disk.
# Voice is 0.3.5 (pull request #71, pinned below), the version the current numbers came from;
# Zoom is main's.

on:
  push:
    branches: [diag/vosk-model]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  VOICE_SHA: 5856780e850ddd00df70e2cd8ab26b06e7e23bdc   # voice/stray-words: Voice 0.3.5

jobs:
  fetch-model:
    name: Fetch ${{ matrix.model }}
    strategy:
      fail-fast: false
      matrix:
        model:
          - vosk-model-small-en-us-0.15
          - vosk-model-en-us-0.22-lgraph
          - vosk-model-en-us-daanzu-20200905-lgraph
          - vosk-model-en-us-0.22
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: models/${{ matrix.model }}
          key: diag-vosk-${{ matrix.model }}
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSfL --retry 3 -o model.zip "https://alphacephei.com/vosk/models/${{ matrix.model }}.zip"
          ls -l model.zip
          rm -rf unzipped && mkdir unzipped models
          python3 -m zipfile -e model.zip unzipped/
          ls unzipped
          # The folder in the zip is the model's name; if it ever isn't, take the one folder there.
          if [ -d "unzipped/${{ matrix.model }}" ]; then src="unzipped/${{ matrix.model }}"; else src="$(ls -d unzipped/*/ | head -1)"; fi
          mv "$src" "models/${{ matrix.model }}"
      - shell: bash
        run: |
          du -sh "models/${{ matrix.model }}"
          find "models/${{ matrix.model }}" -maxdepth 2 | sort

  fetch-speech:
    name: Fetch the recordings
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: data
        uses: actions/cache@v4
        with:
          path: real-speech
          key: real-speech-${{ hashFiles('stress/tools/get_real_speech.py') }}
      - if: steps.data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip install numpy soundfile
          python stress/tools/get_real_speech.py real-speech
      - shell: bash
        run: du -sh real-speech/*

  measure:
    name: ${{ matrix.label }}
    needs: [fetch-model, fetch-speech]
    # One model failing to download shouldn't stop the others being measured.
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[licenses only]') }}
    strategy:
      fail-fast: false
      matrix:
        # Round 1 (commit 591a6f8, run 39879230355) measured small-en-us-0.15, en-us-0.22-lgraph,
        # en-us-daanzu-20200905-lgraph, and the big en-us-0.22 as Voice's open recognizer with
        # small or lgraph commands. Round 2: daanzu again (is its gain real?), and which of
        # Voice's two recognizers the gain comes from.
        include:
          - label: en-us-daanzu-20200905-lgraph (again)
            model: vosk-model-en-us-daanzu-20200905-lgraph
            open_model: ""
          - label: daanzu commands + small-0.15 open (Voice only)
            model: vosk-model-en-us-daanzu-20200905-lgraph
            open_model: vosk-model-small-en-us-0.15
          - label: small-0.15 commands + daanzu open (Voice only)
            model: vosk-model-small-en-us-0.15
            open_model: vosk-model-en-us-daanzu-20200905-lgraph
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODEL: ${{ matrix.model }}
      OPEN_MODEL: ${{ matrix.open_model }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VOICE_SHA }}
          path: voice035
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: models/${{ matrix.model }}
          key: diag-vosk-${{ matrix.model }}
          fail-on-cache-miss: true
      - if: matrix.open_model != ''
        uses: actions/cache/restore@v4
        with:
          path: models/${{ matrix.open_model }}
          key: diag-vosk-${{ matrix.open_model }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: real-speech
          key: real-speech-${{ hashFiles('stress/tools/get_real_speech.py') }}
          fail-on-cache-miss: true
      - name: Install, and say what this runner and model are
        run: |
          pip install pytest psutil numpy pyyaml platformdirs vosk==0.3.44 soundfile
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)|MHz'; free -m
          grep -h __version__ voice035/apps/voice/limitless_voice/__init__.py apps/zoom/limitless_zoom/__init__.py
          for m in "$MODEL" $OPEN_MODEL; do
            echo "== $m: $(du -sb "models/$m" | cut -f1) bytes on disk"
            ls -la "models/$m" "models/$m/graph"
          done
          if [ -x /usr/bin/time ]; then echo "TIMER=/usr/bin/time -v" >> "$GITHUB_ENV"; fi

      - name: Cost, Voice (twice, fresh processes)
        run: |
          open=""; [ -n "$OPEN_MODEL" ] && open="--open-model $PWD/models/$OPEN_MODEL"
          for i in 1 2; do
            echo "---- Voice cost, run $i"
            python -I stress/tools/model_cost.py voice "$PWD/models/$MODEL" $open --repo voice035 \
              --talk real-speech/librispeech 2>&1 \
              | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'
          done

      - name: Cost, Zoom (twice, fresh processes)
        if: matrix.open_model == ''
        run: |
          for i in 1 2; do
            echo "---- Zoom cost, run $i"
            python -I stress/tools/model_cost.py zoom "$PWD/models/$MODEL" --repo . \
              --talk real-speech/librispeech 2>&1 \
              | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'
          done

      - name: Voice 0.3.5 vs real people
        continue-on-error: true
        run: |
          plugin=""
          if [ -n "$OPEN_MODEL" ]; then
            plugin="-p diag_open_model"
            export VOSK_OPEN_MODEL="$PWD/models/$OPEN_MODEL" PYTHONPATH="$PWD/stress/tools"
          fi
          started=$(date +%s)
          VOSK_MODEL="$PWD/models/$MODEL" SPEECH_COMMANDS_DIR="$PWD/real-speech/speech_commands" \
            LIBRISPEECH_DIR="$PWD/real-speech/librispeech" \
            $TIMER python -m pytest voice035/stress/test_voice_real_speech.py $plugin -v -s --durations=5 2>&1 \
            | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'
          echo "Voice tests took $(( $(date +%s) - started )) s"

      - name: Zoom vs real people
        if: matrix.open_model == ''
        continue-on-error: true
        run: |
          started=$(date +%s)
          VOSK_MODEL="$PWD/models/$MODEL" SPEECH_COMMANDS_DIR="$PWD/real-speech/speech_commands" \
            LIBRISPEECH_DIR="$PWD/real-speech/librispeech" \
            $TIMER python -m pytest stress/test_zoom_real_speech.py -v -s --durations=5 2>&1 \
            | awk '/Ignoring word missing in vocabulary/ { if (seen[$0]++) next } { print; fflush() }'
          echo "Zoom tests took $(( $(date +%s) - started )) s"

  # What each model's own files say about its license and training data: the apps ship the model.
  licenses:
    name: Model licenses and READMEs
    needs: [fetch-model]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        model:
          - vosk-model-small-en-us-0.15
          - vosk-model-en-us-0.22-lgraph
          - vosk-model-en-us-daanzu-20200905-lgraph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: models/${{ matrix.model }}
          key: diag-vosk-${{ matrix.model }}
          fail-on-cache-miss: true
      - shell: bash
        run: |
          cd "models/${{ matrix.model }}"
          ls -la
          for f in README* LICENSE* AUTHORS* COPYING* conf/model.conf; do
            [ -f "$f" ] || continue
            echo "==== $f ($(wc -l < "$f") lines)"
            head -c 6000 "$f"; echo
          done

  # Every model's cost on one runner, so the numbers compare: in round 1 each model ran on
  # whatever CPU its runner had (EPYC 7763, 9V74, 9V45, Xeon 8573C). Two rounds, interleaved.
  cost-all:
    name: Cost of every model on one runner
    needs: [fetch-model, fetch-speech]
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[licenses only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VOICE_SHA }}
          path: voice035
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: models/vosk-model-small-en-us-0.15
          key: diag-vosk-vosk-model-small-en-us-0.15
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: models/vosk-model-en-us-0.22-lgraph
          key: diag-vosk-vosk-model-en-us-0.22-lgraph
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: models/vosk-model-en-us-daanzu-20200905-lgraph
          key: diag-vosk-vosk-model-en-us-daanzu-20200905-lgraph
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: models/vosk-model-en-us-0.22
          key: diag-vosk-vosk-model-en-us-0.22
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: real-speech
          key: real-speech-${{ hashFiles('stress/tools/get_real_speech.py') }}
          fail-on-cache-miss: true
      - name: Install, and say what this runner is
        run: |
          pip install pytest psutil numpy pyyaml platformdirs vosk==0.3.44 soundfile
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)|MHz'; free -m
          du -sb models/*
      - name: Cost of each model and pairing, twice
        run: |
          small=models/vosk-model-small-en-us-0.15 lgraph=models/vosk-model-en-us-0.22-lgraph
          daanzu=models/vosk-model-en-us-daanzu-20200905-lgraph big=models/vosk-model-en-us-0.22
          cost() {
            echo "==== round $round: $*"
            python -I stress/tools/model_cost.py "$@" --talk real-speech/librispeech 2>&1 \
              | grep -E '^COST |Error|Traceback' | grep -v '^COST machine' || true
          }
          for round in 1 2; do
            cost voice $small --repo voice035
            cost voice $lgraph --repo voice035
            cost voice $daanzu --repo voice035
            cost voice $daanzu --open-model $small --repo voice035
            cost voice $small --open-model $daanzu --repo voice035
            cost voice $small --open-model $big --repo voice035
            cost voice $lgraph --open-model $big --repo voice035
            cost zoom $small --repo .
            cost zoom $lgraph --repo .
            cost zoom $daanzu --repo .
          done
