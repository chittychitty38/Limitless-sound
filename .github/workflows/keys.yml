name: Limitless Keys

on:
  push:
    branches: [main]
    tags: ["keys-v*"]
    paths: ["apps/keys/**", ".github/workflows/keys.yml"]
  pull_request:
    paths: ["apps/keys/**", ".github/workflows/keys.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            name: mac-apple-silicon
          - os: macos-15-intel  # Intel Macs
            name: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # The Limitless Undo plugin: AU and VST3, effect and instrument, for both
      # kinds of Mac in one bundle, so Logic under Rosetta can load it too.
      - name: Build the Limitless Undo plugin
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build plugin/build --config Release -j 4
      - name: Plugin tests
        env:
          QT_QPA_PLATFORM: offscreen
          LIMITLESS_UNDO_TEST_BINARY: plugin/build/undo_plugin_tests_artefacts/Release/undo_plugin_tests
        run: |
          ctest --test-dir plugin/build --output-on-failure
          python -m pytest -q tests/test_plugin_link.py
      - name: Validate the Audio Units
        run: |
          mkdir -p plugins ~/Library/Audio/Plug-Ins/Components
          for t in LimitlessUndo LimitlessUndoInstrument; do
            cp -R plugin/build/${t}_artefacts/Release/AU/*.component plugins/
            cp -R plugin/build/${t}_artefacts/Release/VST3/*.vst3 plugins/
          done
          for p in plugins/*; do codesign --force --deep --sign - "$p"; done
          cp -R plugins/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Lund Lmls
          auval -v aumu Luni Lmls

      - name: Build app
        run: pyinstaller --noconfirm packaging/limitless_keys.spec
      - name: Self test and package
        run: |
          # One consistent ad-hoc signature, so macOS remembers the permissions you grant.
          codesign --force --deep --sign - "dist/Limitless Keys.app"
          codesign --verify --deep --strict "dist/Limitless Keys.app"
          "dist/Limitless Keys.app/Contents/MacOS/Limitless Keys" --selftest
          find "dist/Limitless Keys.app" -name "Limitless Undo.component" | grep -q .
          mkdir -p dmg
          cp -R "dist/Limitless Keys.app" dmg/
          ln -s /Applications dmg/Applications
          cp "packaging/How to open on a Mac.txt" dmg/
          hdiutil create -volname "Limitless Keys" -srcfolder dmg \
            -ov -format UDZO "dist/Limitless-Keys-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Limitless-Keys-${{ matrix.name }}
          path: apps/keys/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/keys-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
