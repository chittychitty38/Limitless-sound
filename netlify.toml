# The website on Netlify: docs/ built by .github/scripts/netlify-build.mjs for every push to main,
# with a preview for every pull request. Netlify reads everything from here: in Netlify, Add new
# site > Import an existing project > GitHub > Limitless-sound, branch main, and nothing else to set.

[build]
  command = "node .github/scripts/netlify-build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The latest proof, live from the proof-results branch that proof.yml publishes to. The badge comes
# from the GitHub Pages copy, which is served as an image.
[[redirects]]
  from = "/proof/badge.svg"
  to = "https://chittychitty38.github.io/Limitless-sound/proof/badge.svg"
  status = 200
  force = true

[[redirects]]
  from = "/proof/*"
  to = "https://raw.githubusercontent.com/chittychitty38/Limitless-sound/proof-results/:splat"
  status = 200
  force = true

# Short links to share: each download, and each part of the page.
[[redirects]]
  from = "/apple-silicon"
  to = "https://github.com/chittychitty38/Limitless-sound/releases/latest/download/Limitless-Sound-Suite-mac-apple-silicon.pkg"
  status = 302

[[redirects]]
  from = "/intel-mac"
  to = "https://github.com/chittychitty38/Limitless-sound/releases/latest/download/Limitless-Sound-Suite-mac-intel.pkg"
  status = 302

[[redirects]]
  from = "/windows"
  to = "https://github.com/chittychitty38/Limitless-sound/releases/latest/download/Limitless-Sound-Suite-windows.exe"
  status = 302

[[redirects]]
  from = "/download"
  to = "/#download"
  status = 302

[[redirects]]
  from = "/proof"
  to = "/#proof"
  status = 302

[[redirects]]
  from = "/roadmap"
  to = "/#roadmap"
  status = 302

[[redirects]]
  from = "/plan"
  to = "/Limitless-Sound-38x-Plan.pdf"
  status = 302

[[redirects]]
  from = "/standard"
  to = "https://github.com/chittychitty38/Limitless-sound/blob/main/standard/README.md"
  status = 302

[[redirects]]
  from = "/feedback"
  to = "https://github.com/chittychitty38/Limitless-sound/issues/new"
  status = 302

[[redirects]]
  from = "/code"
  to = "https://github.com/chittychitty38/Limitless-sound"
  status = 302

# Every page: only this site's own scripts, styles, fonts and images, and GitHub's API as the
# releases' fallback. No other site may frame it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"

# Fonts never change under the same name; images rarely.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
